[package]
name = "ng_postcode"
version = "0.1.0"
edition = "2024"
description = "DuckDB extension for Nigeria's NIPOST digital postcode (NDAPS)."
license = "MIT"
repository = "https://github.com/Adeniyikayodee/ng-postcode-duckdb"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "ng_postcode"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.20000.0", features = ["loadable-extension", "vscalar"] }
ng-postcode = "0.5.2"
